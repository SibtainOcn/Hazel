# Project-wide Gradle settings.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Suppress performance warning about library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ── The version people read ──
#
# Set this to the version being cut, without the leading v. A tag build overrides it with
# the tag itself, so this is what every other build reports, and it is what F-Droid reads:
# their builder is handed a checkout and a tag, never a -P argument, so the version has to
# be somewhere in the repository for the APK to come out named correctly.
HAZEL_VERSION_NAME=1.0.5

# ── The release counter ──
#
# Bump this by one for every release, and never for anything else. It is not the version
# people read, which comes from the tag; it is the number Android and the stores compare to
# decide whether one build is newer than another, and its only rule is that it goes up.
#
# One bump covers the whole release. The build appends two more digits naming the
# architecture, so a single value here produces a distinct, correctly ordered code for each
# APK the release publishes.
HAZEL_VERSION_CODE=2
