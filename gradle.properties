# Project-wide Gradle settings.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Suppress performance warning about library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ── The release counter ──
#
# Bump this by one for every release, and never for anything else. It is not the version
# people read, which comes from the tag; it is the number Android and the stores compare to
# decide whether one build is newer than another, and its only rule is that it goes up.
#
# One bump covers the whole release. The build appends two more digits naming the
# architecture, so a single value here produces a distinct, correctly ordered code for each
# APK the release publishes.
HAZEL_VERSION_CODE=1
