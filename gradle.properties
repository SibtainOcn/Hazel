# Project-wide Gradle settings.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# High-throughput JVM and GC settings for Gradle
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Dedicated Kotlin compiler daemon heap & fast Parallel GC
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC
kotlin.incremental=true
kotlin.caching.enabled=true

# Suppress performance warning about library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
