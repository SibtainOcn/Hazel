name: Bug report
description: Report an issue or unexpected behavior in Hazel
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ### Before you report
        Hazel has two places for links. Most "not working" reports come from using the wrong one.

        | Content | In the app | Share menu |
        |---|---|---|
        | Videos, reels and audio (most sites) | **Home** tab | **Hazel Video** (choose options) · **Instant Video** (saves at once) |
        | Images, posts, stories, highlights and profiles | **Gallery** tab | **Hazel Gallery** (choose what to save) · **Instant Gallery** (saves at once) |

        If a video fails on the Gallery tab, try it on Home first.

  - type: checkboxes
    id: checks
    attributes:
      label: Prerequisites
      options:
        - label: I am testing against the newest available Hazel build
          required: true
        - label: I searched open and closed tickets to ensure this is not a duplicate
          required: true
        - label: I used the right place for this link (see the table above)
          required: true
        - label: I tried the same link in the other place, and it fails there too
          required: true

  - type: dropdown
    id: entry
    attributes:
      label: Where did you use the link?
      options:
        - Home tab
        - Gallery tab
        - Search
        - "Share: Hazel Video"
        - "Share: Instant Video"
        - "Share: Hazel Gallery"
        - "Share: Instant Gallery"
        - Other (explain in the summary)
    validations:
      required: true

  - type: dropdown
    id: content
    attributes:
      label: What were you downloading?
      options:
        - Video or reel
        - Audio
        - Image or post
        - Story or highlight
        - Profile
        - Not a download (app issue)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Summary of the Issue
      description: Explain what went wrong and how the app behaved unexpectedly.
      placeholder: |
        The download stalls at a specific percentage and fails to finish.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: Describe what should have happened under normal circumstances.
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide clear, step-by-step instructions to replicate the behavior.
      placeholder: |
        1. Open the Home tab (or the share target you used)
        2. Paste the link
        3. Pick a format and start the download
        4. Describe what happened
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Media URL
      description: The link that fails. Use a public link if you can; do not share private links.
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Active Configuration
      description: Any relevant non-default options (audio extraction format, SponsorBlock, custom cookies, incognito mode).
      placeholder: |
        Audio format: MP3
        SponsorBlock: Enabled
        Cookies: Disabled
    validations:
      required: false

  - type: textarea
    id: device
    attributes:
      label: System & Build Details
      description: Include your device model, Android release, and installed Hazel build variant.
      placeholder: |
        Device: Pixel 8
        Android version: 15
        Hazel version: 1.2.18 (arm64-v8a)
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Visual Demonstration
      description: Attach screenshots or a brief screen recording highlighting the defect. Crop out account names, notifications and private links.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Trace & Logs
      description: Copy the log from the failed download in the Failed tab, or paste crash reports.
      render: text
    validations:
      required: false
