# Draft F-Droid recipe for Hazel.
#
# This file does NOT belong in this repository. It is a working copy of what goes into
# fdroiddata as metadata/com.hazel.android.yml, kept here so it can be reviewed before it
# is submitted. Delete it once the merge request is open.
#
# To submit:
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Put this file at metadata/com.hazel.android.yml
#   3. Run:  fdroid readmeta && fdroid rewritemeta com.hazel.android && fdroid lint com.hazel.android
#   4. Build it the way the server will:  fdroid build -v -l com.hazel.android
#   5. Open the merge request
#
# Every versionName and commit below names v1.0.6. Earlier tags cannot be submitted:
# v1.0.4 predates the removal of the foojay toolchain resolver, which F-Droid's scanner
# refuses outright, and v1.0.5 computes its version rather than stating it, which leaves
# their update check unable to find any version information.

# Download is the one that matters, since it is where somebody looking for a downloader
# actually browses. Multimedia and Internet are the broader shelves the app also belongs on.
# Nothing further is listed: F-Droid gains nothing from categories an app only half fits,
# and a reviewer will ask about any that do not obviously apply.
Categories:
  - Download
  - Multimedia
  - Internet

License: GPL-3.0-or-later

AuthorName: SibtainOcn
SourceCode: https://github.com/SibtainOcn/Hazel
IssueTracker: https://github.com/SibtainOcn/Hazel/issues
# /HEAD rather than /main, which is what fdroid lint asks for: it follows the default branch
# whatever that branch is later renamed to.
Changelog: https://github.com/SibtainOcn/Hazel/blob/HEAD/CHANGELOG.md

# The app fetches yt-dlp updates from the GitHub API, which F-Droid classes as depending on
# a non-free network service. It is a label on the listing, not a reason for rejection.
AntiFeatures:
  NonFreeNet:
    en-US: Uses the GitHub API to check for and download yt-dlp engine updates

RepoType: git
Repo: https://github.com/SibtainOcn/Hazel.git

Builds:
  # One entry per output, in ascending version code, which is also the order a device
  # prefers them in. The universal APK is first and lowest, so it is what a device gets only
  # when none of the architecture builds fit; anything matching a real architecture is
  # offered that smaller file instead.
  #
  # output: is relative to subdir:, which is already app/. Writing app/build/... here
  # resolves to app/app/build/... and fails with "No apks match" straight after a build
  # that in fact succeeded, which reads as a build failure and is not one.
  #
  # $$VERSION$$ rather than the literal version, and no gradleprops. F-Droid's bot adds
  # each new release by copying these entries and changing only versionName, versionCode
  # and commit. It does not touch output: or gradleprops:, so a literal version in either
  # would be carried forward and the next release would look for a file the build never
  # produced. $$VERSION$$ is substituted at build time, and the version it stands for comes
  # from the literals in app/build.gradle.kts, which the checkout already has.
  #
  # There is deliberately no build: running ./gradlew here. F-Droid deletes
  # gradle-wrapper.jar before building, because a binary blob in the source tree is exactly
  # what they will not run, and supplies its own Gradle instead. The gradle: field is what
  # asks for that, and gradleprops is how -P arguments reach it. A recipe that calls
  # ./gradlew itself fails with "No such file or directory" after compiling nothing.
  - versionName: 1.0.6
    versionCode: 300
    commit: v1.0.6
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/Hazel-v$$VERSION$$-universal-stable.apk

  - versionName: 1.0.6
    versionCode: 301
    commit: v1.0.6
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/Hazel-v$$VERSION$$-armeabi-v7a-stable.apk

  - versionName: 1.0.6
    versionCode: 302
    commit: v1.0.6
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/Hazel-v$$VERSION$$-x86-stable.apk

  - versionName: 1.0.6
    versionCode: 303
    commit: v1.0.6
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/Hazel-v$$VERSION$$-x86_64-stable.apk

  - versionName: 1.0.6
    versionCode: 304
    commit: v1.0.6
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/Hazel-v$$VERSION$$-arm64-v8a-stable.apk

# Reproducible builds. F-Droid builds from source, compares the result against the APK you
# published, and where they match it ships YOUR signed file, so an update from GitHub and an
# update from F-Droid are the same install.
#
# Leave this commented out for the first submission. Get published first, then turn it on
# once a build has been shown to match, because a mismatch here blocks the release outright.
#
# Binaries: https://github.com/SibtainOcn/Hazel/releases/download/v%v/Hazel-v%v-%a-stable.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.6
CurrentVersionCode: 304
